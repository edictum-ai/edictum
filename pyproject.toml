[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edictum"
version = "0.19.0"
description = "Agency control layer for production AI agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arnold Cartagena", email = "cartagena.arnold@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://edictum.ai"
Documentation = "https://docs.edictum.ai"
Repository = "https://github.com/edictum-ai/edictum"
Changelog = "https://github.com/edictum-ai/edictum/releases"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0", "jsonschema>=4.20"]
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp>=1.20.0"]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
agno = ["agno>=1.0"]
semantic-kernel = ["semantic-kernel>=1.39.4"]
openai-agents = ["openai-agents>=0.1"]
server = ["httpx>=0.27", "httpx-sse>=0.4"]
verified = ["pynacl>=1.5"]
all = ["edictum[yaml,otel,server,verified,langchain,crewai,agno,semantic-kernel,openai-agents]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "coverage>=7.0",
    "httpx>=0.27",
    "pynacl>=1.5",
    "pdoc>=16.0,<17",
]


[tool.uv]
# crewai 1.10.1 pins uv~=0.9.13 and python-dotenv~=1.1.1, which block the
# CVE-complete / 15-day-floor versions. Override those two pins only.
override-dependencies = [
    "uv==0.13.4",
    "python-dotenv==1.2.2",
]
# Dependency cooldown: `uv lock` only picks files uploaded at least 15 days
# ago. This matches Renovate's minimumReleaseAge in renovate.json.
exclude-newer = "15 days"

# Advisory exceptions to the 15-day floor. Each one holds a package at its
# minimum fixing version (edictum#272) by allowing uploads up to that
# version's last file. Each entry is a fixed cutoff, so it also blocks later
# releases. Remove it once the global floor admits the version (date below):
# delete the line, run `uv lock`, and confirm the version did not move.
[tool.uv.exclude-newer-package]
# GHSA-5x8w-8jj5-q52h and the other pillow advisories listed in edictum#272.
# Minimum fixing version 13.0.0, uploaded 2026-10-16. Remove on or after 2026-11-01.
pillow = "2026-10-16T22:19:00Z"
# GHSA-v4x8-3wr5-3wq8 and the other filelock advisories listed in edictum#272.
# Minimum fixing version 4.2.1, uploaded 2026-10-17. Remove on or after 2026-11-02.
filelock = "2026-10-17T16:49:00Z"
# GHSA-hq85-5cpj-mr62 (uv < 0.13.4; pinned by override-dependencies above).
# Minimum fixing version 0.13.4, uploaded 2026-10-20. Remove on or after 2026-11-05.
uv = "2026-10-20T15:13:00Z"
# GHSA-6q48-6c7w-9gw2 / PYSEC-2026-4320 (bundled emSign roots with compromised
# intermediate CA keys). PYSEC still lists 2026.10.18, so the minimum version
# clearing both is 2026.10.19, uploaded 2026-10-20. Remove on or after 2026-11-04.
certifi = "2026-10-20T02:25:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/edictum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--ignore=tests/test_adapter_crewai_smoke.py"]
markers = [
    "security: marks tests as security-related (bypass vectors, boundary checks)",
    "integration: marks tests requiring real HTTP infrastructure (deselected by default, use --run-integration)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
