name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev,yaml,sinks,cli]"
      - run: pytest tests/ -v --ignore=tests/test_adapter_crewai_smoke.py --ignore=tests/test_adapter_claude_smoke.py

  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,yaml,sinks,cli]" mypy "ruff==0.15.5"
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check (informational)
        run: mypy src/edictum/ --ignore-missing-imports
        continue-on-error: true

  security:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev,yaml,sinks,cli]" bandit pip-audit
      - name: Upgrade setuptools (PYSEC-2026-3447)
        # setuptools 79.x ships with the Python 3.11 toolchain and is flagged by
        # pip-audit (PYSEC-2026-3447, fixed in 83.0.0). A patched version exists,
        # so upgrade rather than ignore (unlike the no-fix ignores below).
        run: pip install --upgrade "setuptools>=83"
      - name: Security lint (bandit)
        run: bandit -r src/ -ll -ii
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments 2.19.2 — no upstream fix available yet (latest on PyPI).
        # Transitive dep from pdoc, pytest, rich. Remove ignore when patched version ships.
        # CVE-2026-3219: pip 26.0.1 — no upstream fix available yet (latest on PyPI).
        # Installed by the CI Python toolchain. Remove ignore when patched version ships.
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219
      - name: Security boundary tests
        run: pytest -m security -v --tb=short --ignore=tests/test_adapter_crewai_smoke.py --ignore=tests/test_adapter_claude_smoke.py

  crewai-smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        crewai-version: ["1.5.0", "1.15.16"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install edictum and pinned CrewAI
        run: pip install -e ".[dev,yaml]" "crewai==${{ matrix.crewai-version }}"
      - name: Real-framework CrewAI smokes
        env:
          EDICTUM_CREWAI_SMOKE: "1"
        run: pytest -o addopts= tests/test_adapter_crewai_smoke.py tests/test_behavior/test_crewai_block_behavior.py -v --tb=short

  claude-smoke:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        claude-agent-sdk-version: ["0.1.2", "0.2.139"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install edictum and pinned Claude Agent SDK
        run: pip install -e ".[dev,yaml]" "claude-agent-sdk==${{ matrix.claude-agent-sdk-version }}"
      - name: Provide Claude Code CLI
        run: pip install --target /tmp/claude-host-cli "claude-agent-sdk==0.2.139" && install -m 0755 /tmp/claude-host-cli/claude_agent_sdk/_bundled/claude /usr/local/bin/claude
      - name: Real-framework Claude Agent SDK smokes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3[1m]
          API_TIMEOUT_MS: "3000000"
          EDICTUM_CLAUDE_SMOKE: "1"
        run: pytest -o addopts= tests/test_adapter_claude_smoke.py -v --tb=short
