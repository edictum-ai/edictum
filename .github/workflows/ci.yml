name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          # uv-aarch64-unknown-linux-gnu.tar.gz; the runners are arm64
          checksum: "1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab"
      # Install exactly what uv.lock pins, so CI honours the release-age floor.
      - run: uv sync --frozen --extra dev --extra yaml --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest tests/ -v --ignore=tests/test_adapter_crewai_smoke.py

  quality:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          # uv-aarch64-unknown-linux-gnu.tar.gz; the runners are arm64
          checksum: "1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab"
      - run: uv sync --frozen --extra dev --extra yaml --python 3.11
      - run: uv pip install mypy "ruff==0.15.5"
      - name: Cooldown exceptions are within their dates
        # An exclude-newer-package cutoff also blocks later releases of that
        # package, including the next advisory fix, so it must not outlive
        # its date.
        run: |
          today=$(date -u +%F)
          expired=$(grep -oE 'Remove on or after [0-9]{4}-[0-9]{2}-[0-9]{2}' pyproject.toml | awk -v t="$today" '$5 <= t { print $5 }' || true)
          if [ -n "$expired" ]; then
            echo "::error file=pyproject.toml::cooldown exception past its removal date ($expired); delete it, run uv lock, and confirm no version moved"
            exit 1
          fi
      - name: Lint
        run: uv run --no-sync ruff check src/ tests/
      - name: Format check
        run: uv run --no-sync ruff format --check src/ tests/
      - name: Type check (informational)
        run: uv run --no-sync mypy src/edictum/ --ignore-missing-imports
        continue-on-error: true

  security:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          # uv-aarch64-unknown-linux-gnu.tar.gz; the runners are arm64
          checksum: "1ae72b4718729e2ccc4f1ae2c6d1e531ca8467800e0546e9130b3886023a60ab"
      - run: uv sync --frozen --extra dev --extra yaml --python 3.11
      - run: uv pip install bandit pip-audit
      - name: Security lint (bandit)
        run: uv run --no-sync bandit -r src/ -ll -ii
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments 2.19.2 — no upstream fix available yet (latest on PyPI).
        # Transitive dep from pdoc, pytest, rich. Remove ignore when patched version ships.
        # CVE-2026-3219: pip 26.0.1 — no upstream fix available yet (latest on PyPI).
        # Installed by the CI Python toolchain. Remove ignore when patched version ships.
        run: uv run --no-sync pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219
      - name: Security boundary tests
        run: uv run --no-sync pytest -m security -v --tb=short --ignore=tests/test_adapter_crewai_smoke.py

  crewai-smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        crewai-version: ["1.5.0", "1.15.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install edictum and pinned CrewAI
        run: pip install -e ".[dev,yaml]" "crewai==${{ matrix.crewai-version }}"
      - name: Real-framework CrewAI smokes
        env:
          EDICTUM_CREWAI_SMOKE: "1"
        run: pytest -o addopts= tests/test_adapter_crewai_smoke.py tests/test_behavior/test_crewai_block_behavior.py -v --tb=short
