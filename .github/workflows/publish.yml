name: Publish to PyPI

# Release flow: push one v* tag from main (tag creation is limited to admins;
# push tags one at a time, since a push of more than three tags starts no
# workflow), approve the `pypi` environment, then edit the notes on the draft
# release this workflow creates and publish it. Don't create the tag from the
# release page. Releases are immutable once published, so every asset is
# attached while the release is still a draft.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # No OIDC and no write token here: this job runs the build tooling.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums-digest: ${{ steps.sums.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag commit to be on main and match the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG_NAME" = "v$version"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Build package
        run: uv build

      - name: Generate SBOM (CycloneDX)
        run: |
          uv venv .sbom-venv
          uv pip install "cyclonedx-bom==4.6.1" dist/edictum-*.whl --python .sbom-venv/bin/python
          .sbom-venv/bin/cyclonedx-py environment -o dist/sbom.cdx.json --of JSON .sbom-venv

      - name: Record digests
        id: sums
        working-directory: dist
        run: |
          sha256sum edictum-*.whl edictum-*.tar.gz sbom.cdx.json > SHA256SUMS
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # MUST be GitHub-hosted: PyPI OIDC trusted publishing rejects self-hosted runners
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # PyPI OIDC + Sigstore keyless signing
      contents: write      # create the draft release with its assets
      attestations: write  # SLSA build provenance attestation
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Verify the artifact is the one the build job produced
        working-directory: dist
        env:
          EXPECTED: ${{ needs.build.outputs.sums-digest }}
        run: |
          test -n "$EXPECTED"
          test "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED"
          sha256sum --check --strict SHA256SUMS
          test "$(find . -mindepth 1 -printf "%P\n" | sort)" = "$( { cut -d' ' -f3 SHA256SUMS; echo SHA256SUMS; } | sort)"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@a5caf349bc536fbef3668a10ed7f5cd309a4b53d # v3.2.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Create the draft release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG_NAME" \
            --notes "Release notes pending." \
            dist/*.whl \
            dist/*.tar.gz \
            dist/*.sigstore.json \
            dist/sbom.cdx.json \
            dist/SHA256SUMS

      # Last, because a PyPI upload can't be undone and the draft release can.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
